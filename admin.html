<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c8102e">
    <title>Admin — Results Dashboard | Toyota Boshoku</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Admin-specific tweaks */
        .admin-wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
        .login-card { max-width: 420px; margin: 60px auto; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat {
            background: white;
            padding: 14px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat .num   { font-size: 26px; font-weight: bold; color: var(--primary); display: block; }
        .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; }

        .toolbar {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar input {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        .table-wrap {
            background: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            overflow: auto;
            max-height: calc(100vh - 280px);
        }
        table.results {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table.results thead {
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 2;
        }
        table.results th {
            text-align: left;
            padding: 12px 10px;
            font-weight: 600;
            color: #444;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        table.results th:hover { background: #eef0f3; }
        table.results th .sort-ind { font-size: 11px; opacity: 0.5; margin-left: 4px; }
        table.results td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }
        table.results tr:hover { background: #fafbfc; }
        .pill {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .pill.pass { background: rgba(40,167,69,.15); color: var(--success); }
        .pill.fail { background: rgba(220,53,69,.15); color: var(--danger); }

        .row-actions { display: flex; gap: 6px; }
        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .header-bar h1 { color: var(--primary); font-size: 22px; }
        @media (max-width: 600px) {
            table.results { font-size: 12px; }
            table.results th, table.results td { padding: 8px 6px; }
            .header-bar h1 { font-size: 18px; }
        }
    </style>
</head>
<body>

<!-- ============== LOGIN GATE ============== -->
<section id="loginGate" class="view active">
    <div class="container">
        <div class="card login-card">
            <div class="brand">
                <h1>Admin Login</h1>
                <p class="subtitle">Toyota Boshoku — Results Dashboard</p>
            </div>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="pwInput">Password</label>
                    <input type="password" id="pwInput" placeholder="Enter admin password" autocomplete="current-password" required>
                </div>
                <div id="loginError" class="alert alert-error hidden"></div>
                <button type="submit" class="btn btn-primary btn-block">Login &rarr;</button>
            </form>
            <p class="footer-note"><a href="index.html" style="color: var(--muted);">&larr; Back to test portal</a></p>
        </div>
    </div>
</section>

<!-- ============== DASHBOARD ============== -->
<section id="dashboard" class="view">
    <div class="admin-wrap">

        <div class="header-bar">
            <h1>Results Dashboard</h1>
            <div style="display:flex; gap:8px;">
                <button id="refreshBtn" type="button" class="btn btn-light">⟳ Refresh</button>
                <button id="exportBtn"  type="button" class="btn btn-primary">⇩ Export CSV</button>
                <button id="logoutBtn"  type="button" class="btn btn-secondary">Logout</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat"><span class="num" id="statTotal">0</span><span class="label">Total Submissions</span></div>
            <div class="stat"><span class="num" id="statPass">0</span><span class="label">Passed</span></div>
            <div class="stat"><span class="num" id="statFail">0</span><span class="label">Failed</span></div>
            <div class="stat"><span class="num" id="statAvg">0%</span><span class="label">Avg. Score</span></div>
            <div class="stat"><span class="num" id="statTop">0</span><span class="label">Top Score</span></div>
        </div>

        <div class="toolbar">
            <input type="text" id="searchBox" placeholder="🔍 Search by name, emp code, department…">
            <select id="filterStatus" class="form-group" style="padding:10px 12px; border:1px solid var(--border); border-radius:6px;">
                <option value="">All Status</option>
                <option value="PASS">Pass only</option>
                <option value="FAIL">Fail only</option>
            </select>
        </div>

        <div class="table-wrap">
            <table class="results" id="resultsTable">
                <thead>
                    <tr>
                        <th data-key="rank">#<span class="sort-ind">▾</span></th>
                        <th data-key="full_name">Name <span class="sort-ind">▾</span></th>
                        <th data-key="emp_code">Emp Code <span class="sort-ind">▾</span></th>
                        <th data-key="department">Dept <span class="sort-ind">▾</span></th>
                        <th data-key="score">Score <span class="sort-ind">▾</span></th>
                        <th data-key="percentage">% <span class="sort-ind">▾</span></th>
                        <th data-key="correct">✓</th>
                        <th data-key="wrong">✗</th>
                        <th data-key="skipped">—</th>
                        <th data-key="status">Status</th>
                        <th data-key="submitted_at">Submitted <span class="sort-ind">▾</span></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="11" class="empty">Loading…</td></tr>
                </tbody>
            </table>
        </div>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>

</body>
</html>

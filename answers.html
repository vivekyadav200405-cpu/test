<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c8102e">
    <title>Answer Key — Toyota Boshoku</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .answers-wrap { max-width: 900px; margin: 0 auto; padding: 16px; }

        .login-card { max-width: 420px; margin: 60px auto; }

        .locked-card {
            max-width: 520px;
            margin: 60px auto;
            text-align: center;
        }
        .locked-icon { font-size: 56px; margin-bottom: 12px; }

        .countdown {
            background: #fff8e1;
            color: #8a6d00;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            margin: 18px 0;
        }

        .answer-item {
            background: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 16px 18px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary);
        }
        .ans-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .ans-num   { font-weight: 700; color: var(--primary); }
        .ans-badge {
            background: #e9ecef;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #444;
        }
        .ans-question {
            margin-bottom: 10px;
            font-size: 15px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .ans-options { list-style: none; padding: 0; }
        .ans-options li {
            padding: 6px 10px;
            border-radius: 5px;
            margin-bottom: 4px;
            font-size: 14px;
            background: #f8f9fa;
        }
        .ans-options li.correct {
            background: rgba(40,167,69,.15);
            color: var(--success);
            font-weight: 600;
            border-left: 3px solid var(--success);
        }
        .ans-options li.correct::after {
            content: " ✓ Correct";
            font-weight: 600;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            background: white;
            padding: 14px 16px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        .header-bar h1 { color: var(--primary); font-size: 22px; }
    </style>
</head>
<body>

<!-- ============== LOGIN GATE ============== -->
<section id="loginGate" class="view active">
    <div class="container">
        <div class="card login-card">
            <div class="brand">
                <h1>Answer Key</h1>
                <p class="subtitle">Toyota Boshoku — Trainer Access</p>
            </div>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="pwInput">Password</label>
                    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <div id="loginError" class="alert alert-error hidden"></div>
                <button type="submit" class="btn btn-primary btn-block">Unlock &rarr;</button>
            </form>
            <p class="footer-note"><a href="index.html" style="color: var(--muted);">&larr; Back to test portal</a></p>
        </div>
    </div>
</section>

<!-- ============== TIME-LOCKED ============== -->
<section id="lockedView" class="view">
    <div class="container">
        <div class="card locked-card">
            <div class="locked-icon">🔒</div>
            <h2 style="color: var(--primary); margin-bottom: 8px;">Answer key is locked</h2>
            <p>This page will become available at:</p>
            <p style="font-weight: 600; margin: 8px 0;" id="unlockAtDisplay">—</p>
            <div class="countdown" id="countdown">--:--:--</div>
            <p style="font-size: 13px; color: var(--muted);">
                Please come back after the test window is over.
            </p>
            <p class="footer-note" style="margin-top: 18px;">
                <a href="index.html" style="color: var(--muted);">&larr; Back to portal</a>
            </p>
        </div>
    </div>
</section>

<!-- ============== ANSWER KEY ============== -->
<section id="answersView" class="view">
    <div class="answers-wrap">

        <div class="header-bar">
            <div>
                <h1>Answer Key — 50 Questions</h1>
                <p style="color: var(--muted); font-size: 13px;">Toyota Boshoku Training Assessment</p>
            </div>
            <div style="display:flex; gap:8px;">
                <button id="printBtn"  type="button" class="btn btn-light">🖨 Print</button>
                <button id="logoutBtn" type="button" class="btn btn-secondary">Logout</button>
            </div>
        </div>

        <div id="answersList"></div>

    </div>
</section>

<script src="js/config.js"></script>
<script src="js/questions.js"></script>
<script src="js/answers.js"></script>

</body>
</html>
